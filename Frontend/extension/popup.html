<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            min-height: 400px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }

        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.8;
        }

        .status-section {
            padding: 20px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .status-label {
            font-size: 14px;
            font-weight: 500;
        }

        .status-value {
            font-size: 14px;
            font-weight: 600;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 24px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background: #4CAF50;
        }
        
        #test-data-toggle.active {
            background: #f39c12;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active::after {
            transform: translateX(26px);
        }

        .controls {
            padding: 0 20px 20px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .info {
            padding: 15px 20px;
            font-size: 11px;
            opacity: 0.7;
            line-height: 1.4;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .scanning {
            display: none;
            text-align: center;
            padding: 20px;
            color: #4CAF50;
        }

        .scanning.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(76, 175, 80, 0.3);
            border-radius: 50%;
            border-top-color: #4CAF50;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔒 Security Scanner</h1>
        <p>AI-Powered Website Threat Detection</p>
    </div>

    <div class="status-section">
        <div class="status-item">
            <span class="status-label">Scanner Status</span>
            <div class="toggle-switch" id="scanner-toggle">
                <div class="toggle-switch"></div>
            </div>
        </div>

        <div class="status-item" style="background: rgba(255, 193, 7, 0.2); border: 1px solid rgba(255, 193, 7, 0.3);">
            <span class="status-label">🧪 Use Test Data</span>
            <div class="toggle-switch" id="test-data-toggle">
                <div class="toggle-switch"></div>
            </div>
        </div>

        <div class="status-item">
            <span class="status-label">Websites Scanned</span>
            <span class="status-value" id="scanned-count">0</span>
        </div>

        <div class="status-item">
            <span class="status-label">Last Scan</span>
            <span class="status-value" id="last-scan">Never</span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="clear-scanned">Clear Scanned History</button>
        <button class="btn" id="test-api">Test API Connection</button>
        <button class="btn" id="manual-scan">Manual Scan Current Page</button>
        <button class="btn" id="debug-data" style="background: rgba(255, 193, 7, 0.3); border-color: rgba(255, 193, 7, 0.5);">🐛 Debug Data</button>
    </div>

    <div class="scanning" id="scanning-indicator">
        <div class="spinner"></div>
        <span>Scanning current website...</span>
    </div>

    <div class="info">
        <strong>Keyboard Shortcut:</strong> Ctrl+Shift+S to toggle results overlay<br>
        Results appear automatically after 10 seconds
    </div>

    <script src="popup.js"></script>
</body>
</html>
